<!doctype html>
<html lang="en" data-view="grid">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/argonne-icon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/argonne-touch-icon.png" sizes="180x180" />
		<link rel="mask-icon" href="%sveltekit.assets%/argonne-mask.svg" color="#175ac6" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#175ac6" />
		<script>
			try {
				if (localStorage.getItem('aps:theme') === 'dark')
					document.documentElement.dataset.theme = 'dark';
				if (localStorage.getItem('aps:view') === 'list')
					document.documentElement.dataset.view = 'list';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
